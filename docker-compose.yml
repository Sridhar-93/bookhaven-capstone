services:
  db:
    image: postgres:16-alpine
    container_name: bookhaven-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookhaven
      POSTGRES_USER: bookhaven
      POSTGRES_PASSWORD: bookhaven
    ports: ["5432:5432"]
    volumes:
      - bookhaven-data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookhaven -d bookhaven"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bookhaven-data:
